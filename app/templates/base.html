<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Karting Zárate{% endblock %}</title>
  <style>
    :root { --rojo:#d62828; --negro:#1d1d1d; --gris:#f4f4f4; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin:0; background:var(--gris); color:var(--negro); }
    header { background:var(--negro); color:#fff; padding:14px 20px; display:flex; gap:18px; align-items:center; }
    header a { color:#fff; text-decoration:none; font-size:14px; }
    header .logo { font-weight:800; color:var(--rojo); font-size:18px; }
    main { max-width:680px; margin:24px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    h1 { margin-top:0; }
    label { display:block; margin:12px 0 4px; font-weight:600; font-size:14px; }
    input, select { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
    button, .btn { background:var(--rojo); color:#fff; border:0; padding:12px 18px; border-radius:8px; font-size:15px; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn-sec { background:#444; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    canvas { border:2px dashed #aaa; border-radius:8px; width:100%; height:160px; touch-action:none; background:#fff; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; font-size:14px; }
    .pill { padding:2px 8px; border-radius:999px; font-size:12px; background:#eee; }
    .ok { background:#d4edda; } .wait { background:#fff3cd; }
    .libre { display:inline-block; margin:3px; padding:6px 10px; background:#e7f5e7; border-radius:6px; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🏁 Karting Zárate</span>
    <a href="/">Inicio</a>
    <a href="/registro">Mis datos / Firma</a>
    <a href="/lista-espera">Lista de espera</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
