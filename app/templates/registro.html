{% extends "base.html" %}
{% block title %}Mis datos y firma — {{ brand }}{% endblock %}
{% block body %}
<div class="page-header">
  <div class="container">
    <h1>Mis datos y firma</h1>
    <p>Cargá los datos que el karting siempre pide. Quedan guardados para no volver a escribirlos.</p>
  </div>
</div>

<div class="page">
  <div class="container" style="max-width:760px">
    <div class="card">
      <form method="post" action="/registro" onsubmit="return prepararFirma()">
        <div class="grid2">
          <div><label>Nombre*</label><input name="nombre" required></div>
          <div><label>Apellido*</label><input name="apellido" required></div>
        </div>
        <div class="grid2">
          <div><label>DNI*</label><input name="dni" required></div>
          <div><label>Teléfono (WhatsApp, ej 5491170581324)*</label><input name="telefono" required placeholder="549..."></div>
        </div>
        <div class="grid2">
          <div><label>Email</label><input type="email" name="email"></div>
          <div><label>Fecha de nacimiento</label><input type="date" name="fecha_nacimiento"></div>
        </div>
        <div class="grid2">
          <div><label>Contacto de emergencia</label><input name="contacto_emergencia"></div>
          <div><label>Tel. de emergencia</label><input name="contacto_emergencia_tel"></div>
        </div>

        <label class="check"><input type="checkbox" name="deslinde" required>
          <span>Acepto el <a href="/terminos" target="_blank">deslinde de responsabilidad</a> y declaro que los datos son verídicos.</span></label>

        <label>Firma*</label>
        <canvas id="firma"></canvas>
        <input type="hidden" name="firma_png" id="firma_png">
        <p><button type="button" class="btn btn-ghost" onclick="limpiarFirma()">Borrar firma</button></p>

        <p style="margin-top:18px"><button class="btn btn-lg" type="submit">Guardar y generar comprobante (PDF + QR)</button></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/signature.js"></script>{% endblock %}
